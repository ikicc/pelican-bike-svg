<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Bike Ride — SVG 2D Animation</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #dff4ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: linear-gradient(#bfeaff 0 68%, #d8f0b8 68% 77%, #e2b56e 77% 100%);
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      width: min(100vw, 1280px);
      height: min(100vh, 720px);
      min-height: 420px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(#bfeaff 0 68%, #d8f0b8 68% 77%, #d6a35e 77% 100%);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cloud { animation: cloudMove 18s linear infinite; }
    .cloud.slow { animation-duration: 28s; animation-delay: -12s; }
    .road-stripe { animation: roadMove 1.2s linear infinite; }
    .rider { animation: riderBob 0.55s ease-in-out infinite alternate; transform-origin: 600px 390px; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 0.72s linear infinite; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: spin 0.72s linear infinite; }
    .left-leg { transform-origin: 573px 405px; animation: legLeft 0.72s ease-in-out infinite; }
    .right-leg { transform-origin: 620px 407px; animation: legRight 0.72s ease-in-out infinite; }
    .wing { transform-origin: 555px 335px; animation: wingBounce 0.55s ease-in-out infinite alternate; }
    .head { transform-origin: 505px 275px; animation: headNod 1.1s ease-in-out infinite; }
    .beak-tip { transform-origin: 420px 305px; animation: beakBounce 1.1s ease-in-out infinite; }
    .tail-feather { animation: tailFlutter 0.45s ease-in-out infinite alternate; transform-origin: 642px 344px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes riderBob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes roadMove { from { transform: translateX(0); } to { transform: translateX(-130px); } }
    @keyframes cloudMove { from { transform: translateX(0); } to { transform: translateX(1400px); } }
    @keyframes wingBounce { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }
    @keyframes headNod { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes beakBounce { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-1.5deg); } }
    @keyframes legLeft { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-15deg); } }
    @keyframes legRight { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(8deg); } }
    @keyframes tailFlutter { from { transform: rotate(-2deg); } to { transform: rotate(7deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="SVG 2D animation of a pelican riding a bicycle">
    <svg viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
      <title id="title">Pelican riding a bicycle</title>
      <desc id="desc">A looping two-dimensional SVG animation of a pelican pedaling a bicycle along a road.</desc>

      <rect width="1200" height="700" fill="#bfeaff"/>
      <circle cx="1020" cy="105" r="54" fill="#fff2a8" opacity="0.95"/>

      <g class="cloud" transform="translate(-300 0)" fill="#ffffff" opacity="0.9">
        <ellipse cx="150" cy="120" rx="70" ry="28"/>
        <ellipse cx="115" cy="112" rx="38" ry="31"/>
        <ellipse cx="182" cy="105" rx="43" ry="35"/>
      </g>

      <g class="cloud slow" transform="translate(-520 120)" fill="#ffffff" opacity="0.72">
        <ellipse cx="210" cy="90" rx="62" ry="23"/>
        <ellipse cx="180" cy="83" rx="35" ry="28"/>
        <ellipse cx="235" cy="78" rx="38" ry="31"/>
      </g>

      <path d="M0 455 L120 395 L220 440 L340 365 L455 430 L590 350 L725 420 L870 370 L1010 430 L1200 360 L1200 540 L0 540 Z" fill="#80c994" opacity="0.75"/>
      <path d="M0 500 C180 450 280 510 430 465 C610 410 725 500 900 455 C1030 420 1115 430 1200 450 L1200 560 L0 560 Z" fill="#7fba6f"/>

      <rect x="0" y="520" width="1200" height="75" fill="#9ecb77"/>
      <rect x="0" y="595" width="1200" height="105" fill="#5e6269"/>
      <rect x="0" y="598" width="1200" height="6" fill="#3e4248" opacity="0.6"/>

      <g class="road-stripe">
        <rect x="-120" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="15" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="150" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="285" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="420" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="555" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="690" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="825" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="960" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="1095" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
        <rect x="1230" y="647" width="72" height="8" rx="4" fill="#f9e784"/>
      </g>

      <g class="rider">
        <g class="wheel">
          <circle cx="465" cy="540" r="85" fill="none" stroke="#24272c" stroke-width="12"/>
          <circle cx="465" cy="540" r="72" fill="none" stroke="#adb5bd" stroke-width="2"/>
          <g stroke="#adb5bd" stroke-width="2">
            <line x1="465" y1="468" x2="465" y2="612"/>
            <line x1="393" y1="540" x2="537" y2="540"/>
            <line x1="414" y1="489" x2="516" y2="591"/>
            <line x1="414" y1="591" x2="516" y2="489"/>
          </g>
          <circle cx="465" cy="540" r="8" fill="#24272c"/>
        </g>

        <g class="wheel">
          <circle cx="735" cy="540" r="85" fill="none" stroke="#24272c" stroke-width="12"/>
          <circle cx="735" cy="540" r="72" fill="none" stroke="#adb5bd" stroke-width="2"/>
          <g stroke="#adb5bd" stroke-width="2">
            <line x1="735" y1="468" x2="735" y2="612"/>
            <line x1="663" y1="540" x2="807" y2="540"/>
            <line x1="684" y1="489" x2="786" y2="591"/>
            <line x1="684" y1="591" x2="786" y2="489"/>
          </g>
          <circle cx="735" cy="540" r="8" fill="#24272c"/>
        </g>

        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M465 540 L548 430 L620 540 Z" stroke="#2f7fbd" stroke-width="11"/>
          <path d="M548 430 L670 430 L620 540 L465 540" stroke="#2f7fbd" stroke-width="11"/>
          <path d="M670 430 L735 540" stroke="#2f7fbd" stroke-width="11"/>
          <path d="M657 410 L683 410" stroke="#20242a" stroke-width="8"/>
          <path d="M548 430 L530 400" stroke="#20242a" stroke-width="8"/>
          <path d="M518 400 L548 400" stroke="#20242a" stroke-width="8"/>
          <path d="M670 430 L700 390 L728 390" stroke="#20242a" stroke-width="8"/>
        </g>

        <g class="pedal">
          <circle cx="620" cy="540" r="15" fill="#f2a93b" stroke="#23272d" stroke-width="5"/>
          <line x1="620" y1="540" x2="646" y2="558" stroke="#23272d" stroke-width="7" stroke-linecap="round"/>
          <line x1="620" y1="540" x2="594" y2="522" stroke="#23272d" stroke-width="7" stroke-linecap="round"/>
          <rect x="639" y="554" width="25" height="7" rx="3" fill="#23272d"/>
          <rect x="576" y="515" width="25" height="7" rx="3" fill="#23272d"/>
        </g>

        <g class="tail-feather">
          <path d="M650 345 Q700 330 715 350 Q680 370 642 365 Z" fill="#f1f2f4" stroke="#444b54" stroke-width="4"/>
        </g>

        <ellipse cx="575" cy="345" rx="92" ry="82" fill="#f7f7f4" stroke="#444b54" stroke-width="5"/>
        <path d="M544 408 Q575 430 617 410 L622 445 Q570 470 526 435 Z" fill="#e7e8e4" stroke="#444b54" stroke-width="4"/>

        <g class="wing">
          <path d="M522 326 Q565 288 628 318 Q595 370 540 380 Q512 366 522 326 Z" fill="#e6e8e7" stroke="#444b54" stroke-width="5"/>
          <path d="M548 345 Q581 325 615 327" fill="none" stroke="#b9bdbf" stroke-width="4" stroke-linecap="round"/>
        </g>

        <g fill="none" stroke="#e39b2f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path class="left-leg" d="M552 404 Q568 462 595 518"/>
          <path class="right-leg" d="M609 407 Q628 466 646 552"/>
        </g>
        <ellipse cx="594" cy="520" rx="19" ry="9" fill="#e39b2f"/>
        <ellipse cx="650" cy="554" rx="19" ry="9" fill="#e39b2f"/>

        <g class="head">
          <path d="M520 333 Q492 308 498 270 Q503 229 544 222 Q588 218 606 246 Q622 271 604 300 Q591 320 565 333 Z" fill="#f8f8f5" stroke="#444b54" stroke-width="5"/>
          <circle cx="548" cy="255" r="8" fill="#1f252a"/>
          <circle cx="551" cy="252" r="2.8" fill="#ffffff"/>

          <g class="beak-tip">
            <path d="M512 267 Q455 268 375 296 Q447 309 521 302 Z" fill="#f7b34b" stroke="#704d27" stroke-width="4"/>
            <path d="M520 302 Q450 309 393 304 Q455 346 535 321 Z" fill="#f6a63b" stroke="#704d27" stroke-width="4"/>
            <path d="M390 304 Q380 307 368 302 Q377 294 392 294 Z" fill="#d77e2c"/>
          </g>

          <path d="M515 303 Q467 332 512 365 Q560 381 580 334 Q543 344 515 303 Z" fill="#f4b451" opacity="0.93" stroke="#704d27" stroke-width="4"/>
        </g>

        <path d="M619 356 Q666 372 702 392" fill="none" stroke="#444b54" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="704" cy="392" rx="12" ry="7" fill="#f2a93b"/>
      </g>

      <g stroke="#5d9d4a" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M80 570 l-8 -24 M80 570 l12 -29 M155 570 l-4 -22 M156 570 l17 -19 M1010 570 l-10 -30 M1010 570 l18 -24 M1095 570 l-3 -27 M1096 570 l14 -18"/>
      </g>

      <g opacity="0.75">
        <rect x="28" y="26" width="256" height="50" rx="16" fill="#ffffff"/>
        <text x="50" y="59" font-size="24" font-weight="700" fill="#2a3b4b">Pelican Bike Ride</text>
      </g>
    </svg>
  </main>
</body>
</html>
